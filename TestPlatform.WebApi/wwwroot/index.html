  <!-- Splash Screen Animation Runner -->
  <script>
    (function runSplashScreen() {
      const splash = document.getElementById('app-splash-screen');
      const bar = document.getElementById('splash-progress-bar');
      const statusText = document.getElementById('splash-status-text');
      const percentText = document.getElementById('splash-percent-text');
      if (!splash || !bar) return;

      let progress = 0;
      const stages = [
        { at: 25, text: "Tizim modullari yuklanmoqda..." },
        { at: 60, text: "Shader grafik yadrosi ishga tushirilmoqda..." },
        { at: 88, text: "Xavfsiz muhit tayyorlanmoqda..." },
        { at: 100, text: "Xush kelibsiz!" }
      ];

      const interval = setInterval(() => {
        progress += Math.floor(Math.random() * 16) + 12;
        if (progress > 100) progress = 100;
        
        bar.style.width = progress + '%';
        if (percentText) percentText.textContent = progress + '%';

        const cur = stages.find(s => progress <= s.at) || stages[stages.length - 1];
        if (statusText && cur) {
          statusText.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span> ' + cur.text;
        }

        if (progress >= 100) {
          clearInterval(interval);
          setTimeout(() => {
            splash.style.opacity = '0';
            splash.style.transform = 'scale(1.08)';
            splash.style.filter = 'blur(14px)';
            splash.style.pointerEvents = 'none';
            setTimeout(() => splash.remove(), 750);
          }, 350);
        }
      }, 75);
    })();
  </script>
