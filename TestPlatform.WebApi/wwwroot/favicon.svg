<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3b82f6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGrad)" filter="url(#glow)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Academic Graduation Cap Emblem -->
  <!-- Cap Diamond Top -->
  <polygon points="32,16 50,25 32,34 14,25" fill="url(#capGrad)"/>
  
  <!-- Cap Skull Base -->
  <path d="M20,28.5 L20,38 C20,43 44,43 44,38 L44,28.5 C40,32 24,32 20,28.5 Z" fill="#ffffff" opacity="0.95"/>
  
  <!-- Tassel Cord & Bead -->
  <path d="M47,26.5 L49,38 C49,40 46,41 46,41" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="46" cy="41.5" r="2" fill="#f59e0b"/>

  <!-- Center Achievement Star / Check Sparkle -->
  <polygon points="32,44 33.5,47.5 37,48 34.5,50.5 35,54 32,52 29,54 29.5,50.5 27,48 30.5,47.5" fill="#fbbf24"/>
</svg>
